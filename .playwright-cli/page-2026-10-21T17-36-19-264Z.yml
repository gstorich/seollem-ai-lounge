  - main [ref=f1e17]:
    - paragraph [ref=f1e18]: AZITCHAT · SERVICE GUIDE
    - heading "서비스 소개" [level=1] [ref=f1e19]
    - paragraph [ref=f1e20]: 캐릭터와 나누는 대화부터 하트 이용과 계정 연결까지, 아지트챗의 이용 방법을 안내합니다.
    - generic [ref=f1e21]:
      - heading "내 취향의 AI 캐릭터와 나누는 1:1 채팅" [level=2] [ref=f1e22]
      - paragraph [ref=f1e23]: 아지트챗은 메이비웍스가 운영하는 온라인 디지털 콘텐츠 서비스입니다. 각자의 성격·배경·말투를 가진 가상의 AI 캐릭터를 만나 텍스트로 대화합니다. 실제 사람을 연결하는 만남·채팅 중개 서비스가 아닙니다.
      - paragraph [ref=f1e24]: 남성·여성 캐릭터 중 원하는 조건으로 상대를 찾고, 나누었던 대화를 대화방 목록에서 이어갈 수 있습니다. 답변은 외부 AI API로 생성되며 특정 답변·관계·만족도를 보장하지 않습니다. 생성에 실패하면 오류를 안내하고 해당 답변의 하트는 차감하지 않습니다.
      - link "AI 캐릭터와 대화 시작하기" [ref=f1e25] [cursor=pointer]:
        - /url: /
    - generic [ref=f1e26]:
      - heading "서비스 이용 순서" [level=2] [ref=f1e27]
      - list [ref=f1e28]:
        - listitem [ref=f1e29]:
          - strong [ref=f1e30]: "무료 체험:"
          - text: 게스트로 접속하여 지급된 50하트로 서비스를 둘러봅니다.
        - listitem [ref=f1e31]:
          - strong [ref=f1e32]: "상대 선택:"
          - text: 성별·나이·성격·지역 조건을 설정해 가상의 캐릭터와 연결합니다.
        - listitem [ref=f1e33]:
          - strong [ref=f1e34]: "대화:"
          - text: 일반 텍스트 대화의 AI 답변 1회에 3.7하트를 사용합니다. 첫 인사는 무료입니다. 선물은 실행 전 표시된 비용이 적용되는 가상 콘텐츠입니다.
        - listitem [ref=f1e35]:
          - strong [ref=f1e36]: "번호 연결:"
          - text: 문자 인증으로 번호를 연결하면 해당 번호를 고객 ID로 사용합니다. 최초 연결 혜택은 100하트이며, 하트와 대화는 번호 연결 계정에 보관됩니다.
        - listitem [ref=f1e37]:
          - strong [ref=f1e38]: "충전:"
          - text: 번호 연결 후 하트 상품을 이용하는 구조입니다. 현재 실결제는 준비 중이며 결제와 유료 하트 지급은 발생하지 않습니다.
      - paragraph [ref=f1e39]:
