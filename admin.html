<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>아지트챗 운영 관리</title><link rel="stylesheet" href="/operations.css"><script src="/adminCharacters.js" defer></script><script src="/admin.js" defer></script></head><body>
<section id="login" class="card login"><div class="brand">아지트챗 <small>ADMIN</small></div><h1>운영 관리에 로그인</h1><p class="muted">관리자 비밀번호를 입력해주세요.</p><form id="loginForm"><label for="password">관리자 비밀번호</label><input id="password" type="password" autocomplete="current-password" required maxlength="200"><button class="primary">로그인</button></form><p id="loginError" class="error" role="alert"></p><a href="/">서비스로 돌아가기 ↗</a></section>
<div id="app" class="shell" hidden><aside class="side"><div class="brand">아지트챗</div><small>운영 워크스페이스</small><nav aria-label="관리 메뉴"><button data-view="overview" class="active">◫ 운영 현황</button><button data-view="customers">♙ 인증 회원</button><button data-view="guests">♧ 게스트 세션</button><button data-view="conversations">☷ 전체 채팅</button><button data-view="insights">◇ 대화 분석</button><button data-view="characters">✦ 캐릭터 스튜디오</button><button data-view="commerce">₩ 결제·환불</button><button data-view="tickets">▤ 고객 문의</button><button data-view="analytics">↗ 방문 분석</button><button data-view="audit">≡ 처리 기록</button></nav><div class="footer"><a href="/" target="_blank" rel="noopener">서비스 열기 ↗</a><p>관리 작업은 기록됩니다.</p><button id="logout">로그아웃</button></div></aside><main class="main"><div class="top"><div><p class="muted">AZITCHAT OPERATIONS</p><h1 id="pageTitle">운영 현황</h1></div><div class="row"><select id="days" aria-label="집계 기간"><option value="7">최근 7일</option><option value="30" selected>최근 30일</option><option value="90">최근 90일</option></select><button id="refresh">새로고침</button><button id="mobileLogout">로그아웃</button></div></div><p id="error" class="error" role="alert"></p><div id="content" aria-live="polite"></div><p class="footer">시간은 한국시간(KST) 기준입니다. 결제·환불 내역은 결제·환불 메뉴에서 확인합니다.</p></main></div>
<dialog id="detail"><div class="dialog-top"><h2 id="detailTitle">상세 정보</h2><button id="closeDetail" aria-label="상세 닫기">✕</button></div><p id="detailError" class="error" role="alert"></p><div id="detailContent" class="detail"></div></dialog>
</body></html>
