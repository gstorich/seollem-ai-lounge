server {
    listen 80;
    listen [::]:80;
    server_name azitchat.com www.azitchat.com;
    location ^~ /.well-known/acme-challenge/ {
        root /var/www/seollem-acme;
        try_files $uri =404;
    }
    location / { return 301 https://azitchat.com$request_uri; }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name azitchat.com;
    ssl_certificate /etc/letsencrypt/live/azitchat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azitchat.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    access_log /var/log/nginx/azitchat.access.log;
    error_log /var/log/nginx/azitchat.error.log warn;
    add_header X-Robots-Tag "noindex, nofollow" always;
    client_max_body_size 5m;
    location / {
        proxy_pass http://127.0.0.1:18410;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }
}
server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name www.azitchat.com;
    ssl_certificate /etc/letsencrypt/live/azitchat.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/azitchat.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;
    return 301 https://azitchat.com$request_uri;
}
