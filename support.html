<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>고객센터 · 아지트챗</title><link rel="stylesheet" href="/operations.css"><script src="/support.js" defer></script></head><body><main class="support-shell"><header class="top"><div><a class="brand" href="/">아지트챗</a><p class="muted">고객센터</p></div><a href="/">대화로 돌아가기 ↗</a></header><h1>무엇을 도와드릴까요?</h1><p class="muted">계정, 하트, 대화 이용 중 불편한 점을 남겨주세요.<br>접수한 문의와 운영자 답변을 이곳에서 확인할 수 있습니다.</p><p id="error" class="error" role="alert"></p><section id="auth" class="card" hidden><h2>휴대폰 번호로 문의 이어가기</h2><p class="muted">서비스에서 인증한 번호로 로그인하면 이용 중인 계정과 연결됩니다.</p><form id="sendForm"><label for="phone">휴대폰 번호</label><div class="row"><input id="phone" type="tel" autocomplete="tel" placeholder="01012345678" maxlength="13" required><button class="primary" id="sendCode">인증번호 받기</button></div></form><form id="verifyForm" hidden><label for="code">인증번호</label><div class="row"><input id="code" inputmode="numeric" autocomplete="one-time-code" pattern="[0-9]{6}" maxlength="6" required><button class="primary">인증하고 계속하기</button></div></form><p id="authStatus" class="muted" role="status"></p></section><div id="workspace" class="split" hidden><section class="card"><h2>새 문의</h2><form id="newTicket"><label for="category">문의 유형</label><select id="category"><option value="account">계정·휴대폰 인증</option><option value="hearts">하트 잔액·사용</option><option value="chat">대화 이용</option><option value="payment">결제</option><option value="other">기타</option></select><label for="subject">제목</label><input id="subject" maxlength="100" required><label for="body">문의 내용</label><textarea id="body" maxlength="5000" placeholder="문제가 발생한 상황과 시간을 알려주세요. 비밀번호나 인증번호는 적지 마세요." required></textarea><button class="primary spaced">문의 접수</button></form><p class="muted spaced">답변은 아래 문의 내역에 등록됩니다. 새로고침하여 확인해주세요.</p></section><section class="card"><div class="row"><h2>내 문의 내역</h2><button id="refresh">새로고침</button></div><div id="ticketList"></div><div class="pager"><button id="previous">이전</button><span id="pageLabel" class="muted"></span><button id="next">다음</button></div></section></div><p class="footer">이 고객센터에는 대화 원문이 자동 첨부되지 않습니다.</p></main><dialog id="ticketDetail"><div class="dialog-top"><h2 id="ticketTitle">문의 상세</h2><button id="closeDetail" aria-label="문의 상세 닫기">✕</button></div><p id="detailError" class="error" role="alert"></p><div id="detailContent" class="detail"></div></dialog></body></html>
